<style>

  .chip { appearance: none; border: 1px solid rgba(111,243,255,.45); background: rgba(6,16,24,.55); color: #bff8ff;
    font: 600 11px/1 'Share Tech Mono', monospace; letter-spacing: .14em; border-radius: 10px; cursor: pointer;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }

  #touch { position: fixed; inset: 0; pointer-events: none; z-index: 4; }
  #touch.hidden { display: none; }
  #stick { position: absolute; pointer-events: auto; width: 128px; height: 128px; border-radius: 50%;
    left: calc(18px + env(safe-area-inset-left)); bottom: calc(22px + env(safe-area-inset-bottom));
    border: 1px solid rgba(111,243,255,.35); background: radial-gradient(circle, rgba(111,243,255,.10), rgba(6,16,24,.35)); }
  #knob { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, rgba(200,250,255,.6), rgba(111,243,255,.25)); border: 1px solid rgba(160,250,255,.7); }
  #rb { position: absolute; right: calc(16px + env(safe-area-inset-right)); bottom: calc(22px + env(safe-area-inset-bottom));
    display: grid; grid-template-columns: auto auto; grid-template-rows: auto auto auto; gap: 10px; align-items: end; pointer-events: auto; }
  #wsel { grid-column: 1 / 3; display: flex; gap: 6px; justify-content: flex-end; }
  #wsel .chip { height: 34px; padding: 0 8px; }
  #wsel .chip.on { background: rgba(111,243,255,.3); border-color: #9ff6ff; color: #fff; }
  #ud { display: flex; flex-direction: column; gap: 10px; }

  #fire { width: 96px; height: 96px; border-radius: 50%; font-size: 14px; letter-spacing: .2em;
    border: 2px solid rgba(255,170,90,.8); background: radial-gradient(circle, rgba(255,140,60,.35), rgba(40,12,4,.5)); color: #ffe2c4; }
  #fire:active { background: radial-gradient(circle, rgba(255,170,90,.7), rgba(80,20,4,.6)); }

  .ov { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 24px;
    background: radial-gradient(ellipse at center, rgba(5,7,12,.35), rgba(5,7,12,.88) 75%); transition: opacity .4s; }
  .ov.hidden { opacity: 0; pointer-events: none; }
  .card { text-align: center; max-width: 560px; }
  .card h1 { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: clamp(40px, 12vw, 92px); letter-spacing: .14em; line-height: 1;
    background: linear-gradient(180deg, #ffffff 0%, #9ff6ff 55%, #36b6d8 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 22px rgba(111,243,255,.45)); }
  .sub { margin-top: 12px; font-size: clamp(11px, 3.2vw, 14px); letter-spacing: .32em; color: #8fdcec; }
  .go { margin-top: 30px; appearance: none; cursor: pointer; border: 1px solid #9ff6ff; border-radius: 999px;
    padding: 17px 44px; font: 900 15px/1 'Orbitron', sans-serif; letter-spacing: .3em; color: #03141a;
    background: linear-gradient(90deg, #7ff0ff, #e9fdff); box-shadow: 0 0 30px rgba(111,243,255,.5); }
  .go:active { transform: scale(.96); }
  .ctl { margin-top: 26px; font-size: 12px; line-height: 2; letter-spacing: .08em; color: rgba(220,248,255,.62); }
  .ctl b { color: #bff8ff; font-weight: 400; border: 1px solid rgba(111,243,255,.35); border-radius: 5px; padding: 1px 6px; margin: 0 2px; }
  .big { margin-top: 16px; font-family: 'Orbitron', sans-serif; font-size: clamp(36px, 11vw, 64px); font-weight: 900; color: #fff; text-shadow: 0 0 20px rgba(111,243,255,.6); }
  .warn { color: #ff8a6a; }
  .ov { overflow-y: auto; }
  .ov.dense { background: radial-gradient(ellipse at center, rgba(5,7,12,.72), rgba(5,7,12,.94) 75%); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 18px; }
  .stat { border: 1px solid rgba(111,243,255,.25); border-radius: 10px; padding: 10px 6px; background: rgba(6,16,24,.55); }
  .stat b { display: block; font-family: 'Orbitron', sans-serif; font-size: clamp(15px, 4vw, 20px); color: #fff; }

    background: rgba(6,16,24,.65); color: #dff8ff; font: inherit; transition: transform .1s, background .2s; }

  .cardopt.maxed { opacity: .45; cursor: default; } .cardopt.maxed .cur { color: #9ff6ff; }
  .cards.shop { grid-template-columns: repeat(4, 1fr); } .cards.svc { grid-template-columns: repeat(2, 1fr); }
  .pips { display: flex; gap: 3px; margin-top: 7px; } .pips i { flex: 1; height: 4px; border-radius: 2px; background: rgba(111,243,255,.18); } .pips i.on { background: #7ff0ff; box-shadow: 0 0 6px #7ff0ff; }

  .credits small { font-size: 11px; letter-spacing: .3em; margin-left: 8px; color: #ffd9a0; } .credits em { display: block; font-style: normal; font-family: 'Share Tech Mono', monospace; font-size: 11px; font-weight: 400; color: rgba(255,217,160,.75); letter-spacing: .1em; margin-top: 2px; }
  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 24px; }

  .go[disabled] { opacity: .35; pointer-events: none; }
  .card { max-width: 820px; width: 100%; padding: 24px 0; }
  @media (max-width: 760px) { .cards.shop { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 560px) { .cards, .cards.svc { grid-template-columns: 1fr; } .cards.shop { grid-template-columns: repeat(2, 1fr); } .stats { grid-template-columns: repeat(3, 1fr); } .cardopt p { font-size: 10px; } }
  #err { position: fixed; inset: 0; display: none; place-items: center; text-align: center; padding: 30px; font-size: 14px; color: #bff8ff; z-index: 20; background: #05070c; }
</style>

<script>
(() => {
'use strict';
if (!window.THREE) { document.getElementById('err').style.display = 'grid'; return; }

// ====================================================== utils
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);
const V3 = THREE.Vector3;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};

// ====================================================== renderer / scene
let renderer;

  renderer = new THREE.WebGLRenderer({ antialias: (window.devicePixelRatio || 1) < 2, powerPreference: 'high-performance' });
} catch (e) {
  const er = document.getElementById('err'); er.textContent = 'This device could not start WebGL, which the 3D view needs.'; er.style.display = 'grid'; return;
}
let bloomOn = store.get('kestrel-fx', '1') === '1';
const prHi = () => Math.min(window.devicePixelRatio || 1, matchMedia('(pointer: coarse)').matches ? 1.3 : 1.5);
renderer.setPixelRatio(bloomOn ? prHi() : 1);
const gl = renderer.domElement; gl.id = 'gl'; document.body.prepend(gl);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x060a14);
scene.fog = new THREE.FogExp2(0x161b36, 0.0036);
const camera = new THREE.PerspectiveCamera(75, 1, 0.1, 1600);
camera.rotation.order = 'YXZ';
scene.add(new THREE.HemisphereLight(0x6f88c8, 0x120a10, 0.6));
const moon = new THREE.DirectionalLight(0xb8d0ff, 0.8); moon.position.set(-160, 220, -260); scene.add(moon);
const fill = new THREE.DirectionalLight(0x8fa8d8, 0.55); fill.position.set(60, 90, 240); scene.add(fill);
const boomLight = new THREE.PointLight(0xff9a50, 0, 90, 1.2); scene.add(boomLight);
const muzzleLight = new THREE.PointLight(0xffd090, 0, 16, 1.5); scene.add(muzzleLight);
// sky dome
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { top: { value: new THREE.Color(0x01030a) }, mid: { value: new THREE.Color(0x0a1430) }, hor: { value: new THREE.Color(0x1c1d3c) }, glow: { value: new THREE.Color(0xff7a3a) } },
  vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: 'uniform vec3 top, mid, hor, glow; varying vec3 vP; void main(){ float h = vP.y; vec3 c = mix(hor, mid, smoothstep(0.0, 0.2, h)); c = mix(c, top, smoothstep(0.2, 0.75, h)); c += glow * 0.16 * exp(-abs(h) * 12.0); c += vec3(0.25,0.45,0.9) * 0.05 * exp(-abs(h - 0.05) * 30.0); gl_FragColor = vec4(c, 1.0); }'
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(1300, 32, 16), skyMat); sky.renderOrder = -2; scene.add(sky);
let composer = null, bloomPass = null, gradePass = null;
if (THREE.EffectComposer && THREE.RenderPass && THREE.UnrealBloomPass) {
  try {
    const msaa = renderer.capabilities.isWebGL2 && THREE.WebGLMultisampleRenderTarget ? new THREE.WebGLMultisampleRenderTarget(1, 1, { format: THREE.RGBAFormat }) : undefined;
    composer = new THREE.EffectComposer(renderer, msaa);
    composer.addPass(new THREE.RenderPass(scene, camera));
    bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(256, 256), 0.85, 0.5, 0.7);
    composer.addPass(bloomPass);
    gradePass = new THREE.ShaderPass({
      uniforms: { tDiffuse: { value: null }, time: { value: 0 }, res: { value: new THREE.Vector2(1, 1) } },
      vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
      fragmentShader: `uniform sampler2D tDiffuse; uniform float time; uniform vec2 res; varying vec2 vUv;
        void main(){
          vec2 d = vUv - 0.5; float r2 = dot(d, d); float ca = 0.006 * r2;
          vec3 c = vec3(texture2D(tDiffuse, vUv + d * ca).r, texture2D(tDiffuse, vUv).g, texture2D(tDiffuse, vUv - d * ca).b);
          c = c * (1.0 + c * 0.15) / (1.0 + c * 0.35);
          float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
          c = mix(vec3(l), c, 1.15);
          c += vec3(-0.012, 0.0, 0.03) * (1.0 - l) + vec3(0.035, 0.012, -0.02) * l;
          c = (c - 0.5) * 1.07 + 0.5;
          c *= 1.0 - r2 * 0.85;
          c += (fract(sin(dot(vUv * res + time, vec2(12.9898, 78.233))) * 43758.5453) - 0.5) / 128.0;
          gl_FragColor = vec4(max(c, 0.0), 1.0);
        }`
    });
    composer.addPass(gradePass);
  } catch (e) { composer = null; }
}

const hc = document.getElementById('hud'), mainHx = hc.getContext('2d');
let hx = mainHx;
const glowC = document.createElement('canvas'), glowX = glowC.getContext('2d');
const safeEl = document.getElementById('safe');
let W = 1, H = 1, HD = 1, U = 1, baseFov = 72, sT = 0, sR = 0, sB = 0, sL = 0;
function resize() {
  W = window.innerWidth; H = window.innerHeight;
  renderer.setSize(W, H);
  if (composer) { composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(W, H); }
  camera.aspect = W / H; baseFov = W / H < 1 ? 88 : 72; camera.fov = baseFov; camera.updateProjectionMatrix();
  HD = Math.min(window.devicePixelRatio || 1, 2);
  hc.width = Math.round(W * HD); hc.height = Math.round(H * HD); glowC.width = hc.width; glowC.height = hc.height;
  U = Math.min(W, H) / 100;
  const r = safeEl.getBoundingClientRect(); sT = r.top; sL = r.left; sR = W - r.right; sB = H - r.bottom;
}
window.addEventListener('resize', resize); resize();

// ====================================================== textures
function canvasTex(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); return t; }
const dotTex = canvasTex(64, 64, (g) => {
  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.35, 'rgba(255,255,255,.55)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
});
function winTex(kind) {
  const t = canvasTex(256, 512, (g, w, h) => {
    const base = [['#0d1320', '#121a2a'], ['#0b0f18', '#151c2b'], ['#101522', '#0c1220']][kind];
    const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, base[0]); gr.addColorStop(1, base[1]);
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    const cols = kind === 2 ? 8 : 6, rows = kind === 2 ? 40 : 32, cw = w / cols, rh = h / rows;
    const lit = ['#ffd88a', '#a8ecff', '#fff4dd', '#ffb070', '#c8b6ff'];
    for (let j = 0; j < rows; j++) {
      const floorDark = Math.random() < 0.18, floorBright = Math.random() < 0.08;
      const tint = lit[Math.random() * lit.length | 0];
      for (let i = 0; i < cols; i++) {
        const on = !floorDark && (floorBright || Math.random() < 0.3);
        const x = i * cw + cw * 0.14, y = j * rh + rh * 0.2, ww = cw * 0.72, hh = rh * 0.58;
        if (on) {
          const c = Math.random() < 0.6 ? tint : lit[Math.random() * lit.length | 0];
          const wg = g.createLinearGradient(0, y, 0, y + hh); wg.addColorStop(0, c); wg.addColorStop(1, 'rgba(0,0,0,0.35)');
          g.globalAlpha = rand(0.55, 1); g.fillStyle = wg; g.fillRect(x, y, ww, hh);
        } else { g.globalAlpha = 1; g.fillStyle = Math.random() < 0.5 ? '#16202f' : '#111827'; g.fillRect(x, y, ww, hh); }
      }
      g.globalAlpha = 1; g.fillStyle = 'rgba(0,0,0,0.35)'; g.fillRect(0, j * rh, w, 1.5);
    }
    g.fillStyle = 'rgba(0,0,0,0.3)'; for (let i = 0; i <= cols; i++) g.fillRect(i * cw - 1.5, 0, 3, h);
  });
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8; return t;
}

// ====================================================== city
const CELL = 36, GR = 10, BOUND = 380;
const bmap = new Map(), blds = [];
const bkey = (gx, gz) => gx * 100 + gz;
for (let gx = -GR; gx <= GR; gx++) for (let gz = -GR; gz <= GR; gz++) {
  if (Math.hypot(gx, gz) < 1.6 || Math.random() < 0.08) continue;
  const w = rand(12, 28), d = rand(12, 28);
  const ox = Math.max(0, (CELL - w) / 2 - 2), oz = Math.max(0, (CELL - d) / 2 - 2);
  const cx = gx * CELL + rand(-ox, ox), cz = gz * CELL + rand(-oz, oz);
  const dc = Math.hypot(gx, gz) / GR;
  const h = 14 + Math.pow(Math.random(), 2) * 150 * (1 - dc * 0.6);
  const b = { x0: cx - w / 2, x1: cx + w / 2, z0: cz - d / 2, z1: cz + d / 2, h, cx, cz, w, d, bk: h < 40 ? 0 : h < 90 ? 1 : 2 };
  blds.push(b); bmap.set(bkey(gx, gz), b);
}
{
  const boxG = new THREE.BoxGeometry(1, 1, 1); boxG.translate(0, 0.5, 0);
  const reps = [1.5, 3.5, 7];
  for (let k = 0; k < 3; k++) {
    const list = blds.filter(b => b.bk === k); if (!list.length) continue;
    const tex = winTex(k); tex.repeat.set(1, reps[k] * 0.8);
    const mat = new THREE.MeshStandardMaterial({ color: 0x9aa8bb, map: tex, emissive: 0xffffff, emissiveMap: tex, emissiveIntensity: 0.95, roughness: 0.38, metalness: 0.55 });
    const im = new THREE.InstancedMesh(boxG, mat, list.length);
    const m4 = new THREE.Matrix4();
    list.forEach((b, i) => { m4.makeScale(b.w, b.h, b.d); m4.setPosition(b.cx, 0, b.cz); im.setMatrixAt(i, m4); });
    scene.add(im);
  }
  // rooftop beacons
  const tall = blds.filter(b => b.h > 70);
  const bg = new THREE.BufferGeometry(), bp = new Float32Array(tall.length * 3);
  tall.forEach((b, i) => { bp[i * 3] = b.cx; bp[i * 3 + 1] = b.h + 1.2; bp[i * 3 + 2] = b.cz; });
  bg.setAttribute('position', new THREE.BufferAttribute(bp, 3));
  var beaconMat = new THREE.PointsMaterial({ color: 0xff2a2a, size: 3, map: dotTex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });
  scene.add(new THREE.Points(bg, beaconMat));
  // ground
  const gt = canvasTex(256, 256, (g, w) => {
    const rd = w * 0.13;
    g.fillStyle = '#0c1019'; g.fillRect(0, 0, w, w);

function placeCamera() {
  const lat = player.vel.dot(right);
  camera.position.copy(player.pos);
  if (shake > 0) { const s = shake * shake * 0.35; camera.position.x += rand(-s, s); camera.position.y += rand(-s, s); camera.position.z += rand(-s, s); }
  camera.rotation.set(player.pitch, player.yaw, clamp(-lat * 0.012, -0.25, 0.25));
  const f = baseFov + smooth(visorT) * 6 + clamp(player.vel.length() - 30, 0, 30) * 0.15;
  if (Math.abs(camera.fov - f) > 0.05) { camera.fov = f; camera.updateProjectionMatrix(); }
  camera.updateMatrixWorld();
  camera.getWorldDirection(fwd);
}
function updatePlayer(dt) {
  const k = c => keys[c] ? 1 : 0;
  // keyboard look
  const lx = k('ArrowRight') - k('ArrowLeft'), ly = k('ArrowDown') - k('ArrowUp');
  if (lx || ly) look(lx * 900 * dt, ly * 600 * dt, 0.0022);
  const inF = k('KeyW') - k('KeyS') - stickY;
  const inR = k('KeyD') - k('KeyA') + stickX;
  const inU = clamp(k('Space') + k('KeyE') - k('KeyC') - k('KeyX') - k('ControlLeft') + (touchUp ? 1 : 0) - (touchDown ? 1 : 0), -1, 1);
  const boost = keys.ShiftLeft || keys.ShiftRight ? 1.8 : 1;
  const sy = Math.sin(player.yaw), cy = Math.cos(player.yaw);
  right.set(cy, 0, -sy);
  const A = 70 * boost * (0.4 + 0.6 * legF()) * (1 + 0.12 * upg.thrust);
  // forward thrust follows where you look: aim up to climb, aim down to dive
  const cp = Math.cos(player.pitch), spch = Math.sin(player.pitch);
  player.vel.x += (-sy * cp * inF + cy * inR) * A * dt;
  player.vel.z += (-cy * cp * inF - sy * inR) * A * dt;
  player.vel.y += (spch * inF + inU) * A * dt;
  if (!inF && !inU) player.vel.y *= Math.exp(-dt * 1.5);
  player.vel.multiplyScalar(Math.exp(-dt * 2.2));
  const ms = 48 * boost * (1 + 0.12 * upg.thrust); if (player.vel.length() > ms) player.vel.setLength(ms);
  const p = player.pos; p.addScaledVector(player.vel, dt);
  p.x = clamp(p.x, -BOUND, BOUND); p.z = clamp(p.z, -BOUND, BOUND);
  if (p.y < 1.6) { p.y = 1.6; player.vel.y = Math.max(0, player.vel.y); }
  if (p.y > 320) { p.y = 320; player.vel.y = Math.min(0, player.vel.y); }
  const b = bIn(p.x, p.y, p.z, 1.2);
  if (b) {
    const pad = 1.2, dxl = p.x - (b.x0 - pad), dxr = (b.x1 + pad) - p.x, dzl = p.z - (b.z0 - pad), dzr = (b.z1 + pad) - p.z, dy = (b.h + pad) - p.y;
    const m = Math.min(dxl, dxr, dzl, dzr, dy);
    if (m === dy) { p.y = b.h + pad; player.vel.y = Math.max(0, player.vel.y); }
    else if (m === dxl) { p.x = b.x0 - pad; player.vel.x = Math.min(0, player.vel.x); }
    else if (m === dxr) { p.x = b.x1 + pad; player.vel.x = Math.max(0, player.vel.x); }
    else if (m === dzl) { p.z = b.z0 - pad; player.vel.z = Math.min(0, player.vel.z); }
    else { p.z = b.z1 + pad; player.vel.z = Math.max(0, player.vel.z); }
  }
}

    const tape = (x, val, step, label, dirR) => {
      hx.strokeStyle = C(0.7); hx.lineWidth = 1; hx.beginPath();
      hx.moveTo(x, cy - tapeH / 2); hx.lineTo(x, cy + tapeH / 2);
      const span = step * 5;
      for (let v = Math.ceil((val - span) / step) * step; v <= val + span; v += step) {
        const y = cy - (v - val) / span * tapeH / 2, big = v % (step * 5) === 0;
        hx.moveTo(x, y); hx.lineTo(x + (dirR ? 1 : -1) * (big ? 9 : 4), y);
      }
      hx.stroke();
      const bw2 = fs * 3.6, bx2 = dirR ? x + 12 : x - 12 - bw2;
      hx.fillStyle = 'rgba(4,14,20,0.6)'; hx.fillRect(bx2, cy - fs * 0.8, bw2, fs * 1.6);
      hx.strokeStyle = C(0.9); hx.strokeRect(bx2, cy - fs * 0.8, bw2, fs * 1.6);
      hx.fillStyle = '#fff'; hx.textAlign = 'center'; hx.fillText(String(Math.round(val)), bx2 + bw2 / 2, cy + fs * 0.35);
      hx.fillStyle = C(0.75); hx.font = font(fs * 0.8); hx.fillText(label, bx2 + bw2 / 2, cy - tapeH / 2 - 6); hx.font = font(fs);
    };
    tape(lxp, player.vel.length() * 3.6, 10, 'SPD', true);
    tape(rxp, player.pos.y, 5, 'ALT', false);

    // --- radar
    hx.fillStyle = 'rgba(4,14,20,0.45)'; hx.beginPath(); hx.arc(rcx, rcy, rr2, 0, TAU); hx.fill();
    hx.strokeStyle = C(0.6); hx.lineWidth = 1; hx.stroke();
    hx.strokeStyle = C(0.2); hx.beginPath(); hx.arc(rcx, rcy, rr2 * 0.5, 0, TAU); hx.moveTo(rcx - rr2, rcy); hx.lineTo(rcx + rr2, rcy); hx.moveTo(rcx, rcy - rr2); hx.lineTo(rcx, rcy + rr2); hx.stroke();
    const sw = RT * 2.2; hx.strokeStyle = C(0.5); hx.beginPath(); hx.moveTo(rcx, rcy); hx.lineTo(rcx + Math.cos(sw) * rr2, rcy + Math.sin(sw) * rr2); hx.stroke();
    const fx = -Math.sin(player.yaw), fz = -Math.cos(player.yaw), rx = Math.cos(player.yaw), rz = -Math.sin(player.yaw);
    for (const en of enemies) {
      const dx = en.pos.x - player.pos.x, dz = en.pos.z - player.pos.z;
      let px = (dx * rx + dz * rz) / 160 * rr2, py = -(dx * fx + dz * fz) / 160 * rr2;
      const dl = Math.hypot(px, py); if (dl > rr2 - 3) { px *= (rr2 - 3) / dl; py *= (rr2 - 3) / dl; }
      hx.fillStyle = en === lockCand ? '#ffb347' : '#ff5a3a'; hx.beginPath(); hx.arc(rcx + px, rcy + py, 2.6, 0, TAU); hx.fill();
    }
    for (const pk of pickups) {
      const dx = pk.g.position.x - player.pos.x, dz = pk.g.position.z - player.pos.z;
      let px = (dx * rx + dz * rz) / 160 * rr2, py = -(dx * fx + dz * fz) / 160 * rr2;
      const dl = Math.hypot(px, py); if (dl > rr2 - 3) { px *= (rr2 - 3) / dl; py *= (rr2 - 3) / dl; }
      hx.fillStyle = pk.type === 'ammo' ? '#46e6ff' : '#6dff9a'; hx.fillRect(rcx + px - 2, rcy + py - 2, 4, 4);
    }
    hx.fillStyle = '#fff'; hx.beginPath(); hx.moveTo(rcx, rcy - 5); hx.lineTo(rcx + 4, rcy + 4); hx.lineTo(rcx - 4, rcy + 4); hx.fill();
    hx.textAlign = 'right'; hx.fillStyle = C(0.9);
    hx.fillText(`WAVE ${wave}`, rcx + rr2, rcy + rr2 + fs + 6);
    hx.fillText(`HOSTILES ${enemies.length}`, rcx + rr2, rcy + rr2 + fs * 2 + 9);
    hx.fillStyle = '#fff'; hx.fillText(score.toLocaleString(), rcx + rr2, rcy + rr2 + fs * 3 + 12);
    hx.fillStyle = '#ffb347'; hx.fillText(`${credits.toLocaleString()} CR`, rcx + rr2, rcy + rr2 + fs * 4 + 15);

    // --- AI log
    hx.textAlign = 'left';
    const narrow = W < 720;
    const lx = Math.max(frameM() + 10, 16 + sL);
    let ly = narrow ? ty + fs * 2.6 + 18 : 12 + sT + 38 + 14 + fs;
    const maxW = (narrow ? rcx - rr2 - 10 : cx - cw / 2 - 16) - lx - fs * 3.3;
    for (const m of log.slice(-3)) {
      const age = RT - m.at; if (age > 8) continue;
      const shown = m.t.slice(0, Math.floor(age * 45));
      hx.globalAlpha = A * clamp((8 - age) / 1.5, 0, 1);
      hx.fillStyle = C(0.6); hx.fillText('WREN›', lx, ly);
      hx.fillStyle = '#e9fbff';
      let line = '';
      for (const w of shown.split(' ')) {
        const t2 = line ? line + ' ' + w : w;
        if (hx.measureText(t2).width > maxW && line) { hx.fillText(line, lx + fs * 3.3, ly); ly += fs * 1.3; line = w; } else line = t2;
      }
      hx.fillText(line, lx + fs * 3.3, ly);
      ly += fs * 1.5;
    }
    hx.globalAlpha = A;

    // --- suit status diagram
    drawSuit(fs);

    // --- bottom status
    const by0 = touchUI ? H - sB - 250 : H - sB - H * 0.06 - fs * 5.2 - 10;
    const bw = clamp(W * 0.34, 130, 300), bx0 = cx - bw / 2;
    hx.font = font(fs * 0.85);
    bar(bx0, by0, bw, 5, player.shield / maxShield(), visorOpen ? 'rgba(111,243,255,0.25)' : C(0.95), 'SHD');
    bar(bx0, by0 + fs * 1.2, bw, 5, player.armor / 100, player.armor < 30 ? '#ff5a3a' : '#e9fbff', 'SUIT');
    const names2 = ['GUN', 'LASER', 'ROCKET', 'SWARM'];
    const info = [`${ammo.gun}`, overheat ? 'HOT' : `${Math.round(heat * 100)}%`, `${ammo.rkt}`, `${ammo.swm}×4`];
    const low = [ammo.gun < 60, overheat, ammo.rkt < 3, ammo.swm < 1], empty = [ammo.gun <= 0, false, ammo.rkt <= 0, ammo.swm <= 0];
    const slotW = bw / 4, sy0 = by0 + fs * 2.3;
    hx.textAlign = 'center';
    if (touchUI) { hx.fillStyle = empty[weapon] ? '#ff5a3a' : low[weapon] ? '#ffb347' : '#fff'; hx.fillText(`${names2[weapon]}  ${info[weapon]}`, cx, sy0 + fs * 0.9); }
    else for (let i = 0; i < 4; i++) {
      const sx = bx0 + slotW * i;
      if (i === weapon) { hx.fillStyle = C(0.16); hx.fillRect(sx + 2, sy0, slotW - 4, fs * 2.6); hx.strokeStyle = C(0.9); hx.strokeRect(sx + 2, sy0, slotW - 4, fs * 2.6); }
      hx.fillStyle = i === weapon ? '#ffffff' : C(0.55);
      hx.fillText(names2[i], sx + slotW / 2, sy0 + fs * 1.1);
      hx.fillStyle = empty[i] ? '#ff5a3a' : low[i] ? '#ffb347' : i === weapon ? C(1) : C(0.45);
      hx.fillText(info[i], sx + slotW / 2, sy0 + fs * 2.2);
    }
    hx.font = font(fs);

    // --- warnings
    const blink = Math.floor(RT * 3) % 2 === 0;
    let wy = cy + 12 * U;
    hx.textAlign = 'center';
    if (blink && player.armor < 30) { hx.fillStyle = '#ff5a3a'; hx.fillText('⚠ SUIT INTEGRITY CRITICAL', cx, wy); wy += fs * 1.4; }
    if (blink && player.shield <= 0) { hx.fillStyle = '#ffb347'; hx.fillText('SHIELDS DOWN', cx, wy); wy += fs * 1.4; }
    if (overheat && weapon === 1) { hx.fillStyle = '#ff5a3a'; hx.fillText('LASER VENTING', cx, wy); wy += fs * 1.4; }
    if ((weapon === 0 && ammo.gun <= 0) || (weapon === 2 && ammo.rkt <= 0) || (weapon === 3 && ammo.swm <= 0)) { hx.fillStyle = blink ? '#ff5a3a' : '#ffb347'; hx.fillText('NO AMMO — COLLECT CACHES OR SWITCH', cx, wy); wy += fs * 1.4; }
    if (menuPending > 0) { hx.fillStyle = C(1); hx.fillText('SECTOR SECURED', cx, cy - 10 * U); }
    if (!enemies.length && waveTimer > 0 && wave > 0 && !menuPending) { hx.fillStyle = C(0.9); hx.fillText(`NEXT WAVE ${Math.ceil(waveTimer)}`, cx, cy - 10 * U); }

    // --- boot
    if (bootT < 1) {
      hx.globalAlpha = (1 - bootT) * 1.2 > 1 ? 1 : (1 - bootT) * 1.2;
      hx.fillStyle = C(1); hx.fillText(visorOpen ? '' : 'WREN // SUIT OS 4.2 — SYSTEMS ONLINE', cx, cy - 6 * U);
      hx.fillStyle = C(0.25); hx.fillRect(cx - 60, cy - 4.5 * U, 120, 3);
      hx.fillStyle = C(1); hx.fillRect(cx - 60, cy - 4.5 * U, 120 * bootT, 3);
    }
    hx.globalAlpha = 1;
  }
  if (useGlow) {
    hx = mainHx;
    hx.save(); hx.setTransform(1, 0, 0, 1, 0, 0);
    hx.shadowColor = 'rgba(80,230,255,0.85)'; hx.shadowBlur = 9 * HD;
    hx.drawImage(glowC, 0, 0);
    hx.restore();
  }

  // visor-open minimal overlay
  if (e > 0.5 && state === 'play') {
    const a = (e - 0.5) * 2;
    hx.globalAlpha = a * 0.75; hx.fillStyle = '#fff';
    hx.beginPath(); hx.arc(cx, cy, 2.2, 0, TAU); hx.fill();
    hx.font = font(fs * 0.85); hx.textAlign = 'center';
    const vy = touchUI ? H - sB - 250 : H - sB - 28;
    hx.fillText(`VISOR OPEN · NO HUD · ARMOR EXPOSED · ${touchUI ? 'TAP VISOR' : 'PRESS V'} TO SEAL`, cx, vy);
    hx.globalAlpha = 1;
  }
  drawFrame(e);
}

// ====================================================== loop
function setFx(on, quiet) {
  bloomOn = on && !!composer; store.set('kestrel-fx', bloomOn ? '1' : '0');
  renderer.setPixelRatio(bloomOn ? prHi() : 1); resize();
  $('bFx').textContent = bloomOn ? 'FX HI' : 'FX LO';
  if (!quiet && state === 'play') msg(bloomOn ? 'Visual enhancement on.' : 'Visual enhancement reduced.');
}
let perfT = 0, perfN = 0, perfDone = false;
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now; RT += dt;
  if (state === 'play') update(dt);
  else if (state === 'title') {
    T += dt; player.yaw += dt * 0.07; player.pitch = -0.08 + Math.sin(RT * 0.3) * 0.05; placeCamera(); updateEnemies(dt); updateFx(dt);
  } else if (state === 'dead') {
    T += dt * 0.3; updateEnemies(dt * 0.3); updateProjectiles(dt * 0.3); placeCamera();
  } else placeCamera();
  if (state === 'play' || state === 'dead' || state === 'menu') updateFx(state === 'dead' ? dt * 0.4 : dt);
  if (state === 'menu') player.yaw += dt * 0.05;
  shake = Math.max(0, shake - dt * 1.6); hurt = Math.max(0, hurt - dt * 1.8); hitMarker -= dt;
  beaconMat.opacity = 0.35 + 0.65 * (Math.sin(RT * 3) > 0.6 ? 1 : 0);
  if (state !== 'pause') updateTraffic(dt);
  sky.position.copy(camera.position); stars.position.copy(camera.position);
  moonSpr.position.set(camera.position.x - 520, camera.position.y + 560, camera.position.z - 880);
  if (state === 'play' && !perfDone) {
    perfT += dt; perfN++;
    if (perfT > 5) { perfDone = true; if (bloomOn && perfN / perfT < 30) { setFx(false, true); msg('Graphics scaled down to keep things smooth. Tap FX to change.'); } }
  }
  updateAtmo(dt); if (gradePass) { gradePass.uniforms.time.value = RT % 100; gradePass.uniforms.res.value.set(W, H); }
  smoke.mat.uniforms.scale.value = renderer.getPixelRatio() * H / 2 / Math.tan(camera.fov * Math.PI / 360);
  if (composer && bloomOn) composer.render(); else renderer.render(scene, camera);
  drawHUD();
}
showOv('title');
setFx(bloomOn, true);
wave = 1; for (let i = 0; i < 4; i++) spawnEnemy(); wave = 0;
requestAnimationFrame(frame);
})();
</script>

  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
